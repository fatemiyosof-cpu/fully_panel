services:
  - type: web
    name: arcodm-panel-subscription
    env: docker
    plan: free
    envVars:
      - key: ADMIN_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://arcodm-panel-subscription.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: arcodm-subscription-db
          property: connectionString
databases:
  - name: arcodm-subscription-db
    plan: free
